name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required checks must be reported for every PR, including documentation changes.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit the complete lockfile
        run: pnpm audit --audit-level low

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan with Semgrep CLI
        shell: bash
        run: |
          umask 077
          report_dir="$RUNNER_TEMP/semgrep-report"
          mkdir -p "$report_dir"
          status=0
          # Semgrep 1.178.0, official image pinned by digest.
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$report_dir,dst=/reports" \
            --workdir /src --entrypoint semgrep \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            scan --strict --error --metrics=off --disable-version-check \
            --config p/default --config p/typescript --config p/javascript --config p/secrets \
            --json --output /reports/semgrep.json \
            > "$report_dir/diagnostics.log" 2>&1 || status=$?
          python3 -B scripts/security_scan_report.py semgrep "$report_dir/semgrep.json" "$status"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install free Gitleaks CLI
        shell: bash
        run: |
          umask 077
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full history with Gitleaks CLI
        shell: bash
        run: |
          umask 077
          report_dir="$RUNNER_TEMP/gitleaks-report"
          mkdir -p "$report_dir"
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner \
            --report-format json --report-path "$report_dir/gitleaks.json" . \
            > "$report_dir/diagnostics.log" 2>&1 || status=$?
          python3 -B scripts/security_scan_report.py gitleaks "$report_dir/gitleaks.json" "$status"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          license-check: true
          vulnerability-check: true
          fail-on-severity: high
      - name: Report dependency-review findings count
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
          DENIED_CHANGES: ${{ steps.review.outputs.denied-changes }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          if os.environ.get('REVIEW_OUTCOME') != 'success':
            sys.exit('dependency-review failed; no clean result available')

          def count_payload(value) -> int:
            if isinstance(value, list):
              return len(value)
            if isinstance(value, dict):
              return sum(count_payload(item) for item in value.values())
            raise ValueError('invalid dependency-review output')

          def count(name: str) -> int:
            raw = os.environ.get(name, '').strip()
            if not raw:
              sys.exit('dependency-review output missing; no clean result available')
            return count_payload(json.loads(raw))

          total = (
            count('VULNERABLE_CHANGES')
            + count('INVALID_LICENSE_CHANGES')
            + count('DENIED_CHANGES')
          )
          print(f'dependency-review findings: {total}')
          PY
