name: quorum-audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: quorum-audit-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  # Finish publication before another run updates the same check.
  cancel-in-progress: false

jobs:
  quorum-publisher:
    # This runner job must not share the required PR-head check's name.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # No checkout: publishing never executes code from a PR's worktree.
      - name: Evaluate and publish current-head quorum
        shell: bash
        run: |
          set -euo pipefail

          check_id=""
          fail_audit() {
            original_status=$?
            trap - ERR
            echo "::error::Quorum evaluation or publication failed."
            if [[ -n "$check_id" ]]; then
              payload="$(jq -n '{status: "completed", conclusion: "failure", output: {title: "Quorum audit could not complete", summary: "An API or evaluation error prevented verification. No quorum is certified."}}')"
              if ! gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" \
                -X PATCH --input - <<<"$payload" >/dev/null; then
                echo "::error::Could not finalize the PR-head check; inspect the pending check and publisher failure."
              fi
            fi
            exit "$original_status"
          }
          trap fail_audit ERR

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr_path="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          pr_head_sha="$(gh api "$pr_path" | jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))')"
          external_id="quorum-audit:pr-${PR_NUMBER}:${pr_head_sha}"

          # Reuse our check for this PR/head. Invalidate an earlier success
          # before reading signatures, so read failures cannot preserve it.
          check_id="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/check-runs?check_name=quorum-audit&filter=all&per_page=100" |
            jq -r --arg external_id "$external_id" '
              [.[] | .check_runs[] | select(.external_id == $external_id and .app.slug == "github-actions")]
              | max_by(.id) | .id // empty'
          )"
          payload="$(
            jq -n --arg sha "$pr_head_sha" --arg external_id "$external_id" \
              '{name: "quorum-audit", head_sha: $sha, external_id: $external_id, status: "in_progress",
                output: {title: "Quorum audit in progress", summary: "Refreshing signatures on the current PR head."}}'
          )"
          if [[ -n "$check_id" ]]; then
            [[ "$check_id" =~ ^[1-9][0-9]*$ ]]
            payload="$(jq 'del(.head_sha)' <<<"$payload")"
            gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" \
              -X PATCH --input - <<<"$payload" >/dev/null
          else
            check_id="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -X POST --input - <<<"$payload" | jq -er '.id | numbers')"
          fi

          issue_comments_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          reviews_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          discussion_json="$(
            jq -n --arg sha "$pr_head_sha" \
              --argjson comments "$issue_comments_json" --argjson reviews "$reviews_json" '
              [($comments[]?[]? | {body}),
               ($reviews[]?[]? | select((.state == "APPROVED" or .state == "COMMENTED") and .commit_id == $sha) | {body})]'
          )"

          author_found="$(jq -r --arg sha "$pr_head_sha" '
            any(.[]; (.body // "") | test("^Agent WS[12]:[ \\t]+(authored at|implemented[^\\r\\n]* at) " + $sha + "\\b"; "m"))
            ' <<<"$discussion_json")"
          reviewer_found="$(jq -r --arg sha "$pr_head_sha" '
            any(.[]; (.body // "") | test("^Agent R3:[ \\t]+(no findings on|concur at) " + $sha + "\\b"; "m"))
            ' <<<"$discussion_json")"
          controller_found="$(jq -r --arg sha "$pr_head_sha" '
            any(.[]; (.body // "") | test("^Agent (Controller|BOSS):[ \\t]+concur at " + $sha + "\\b"; "m"))
            ' <<<"$discussion_json")"
          issue_comments_scanned="$(jq '[.[]?[]?] | length' <<<"$issue_comments_json")"
          reviews_scanned="$(jq --arg sha "$pr_head_sha" \
            '[.[]?[]? | select((.state == "APPROVED" or .state == "COMMENTED") and .commit_id == $sha)] | length' <<<"$reviews_json")"

          conclusion="failure"
          title="Quorum signatures missing"
          if [[ "$author_found" == "true" && "$reviewer_found" == "true" && "$controller_found" == "true" ]]; then
            conclusion="success"
            title="Quorum signatures verified"
          fi
          current_head_sha="$(gh api "$pr_path" | jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))')"
          if [[ "$current_head_sha" != "$pr_head_sha" ]]; then
            conclusion="failure"
            title="PR head changed during quorum audit"
          fi
          summary="$(printf 'author=%s\nreviewer=%s\ncontroller=%s\nhead=%s\ncurrent_head=%s\nissue_comments_scanned=%s\nreviews_scanned=%s\nlifecycle=not-enforced' \
            "$author_found" "$reviewer_found" "$controller_found" "$pr_head_sha" "$current_head_sha" "$issue_comments_scanned" "$reviews_scanned")"
          payload="$(jq -n --arg conclusion "$conclusion" --arg title "$title" --arg summary "$summary" \
            '{status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}')"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" \
            -X PATCH --input - <<<"$payload" >/dev/null

          echo "quorum-audit: ${summary}"
          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi
